name: Sync collection

on:
  schedule:
    # GitHub sometimes skips scheduled runs when busy, so ask twice an hour; runs queue, never overlap.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      # Latest main, not the commit that queued this run, so synced data never starts out stale.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Pull collection from Discogs
        env:
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'Philippemccc' }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python sync/sync_discogs.py

      - name: Find BPM and key
        env:
          ENRICH_MINUTES: "25"
        run: python sync/enrich.py

      - name: Keep the sound models between runs
        uses: actions/cache@v4
        with:
          path: .models
          key: essentia-models-v2

      - name: Profile how tracks sound
        env:
          PROFILE_MINUTES: "25"
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python sync/profile.py

      - name: Save synced data to the repo
        run: |
          git config user.name "crate-sync"
          git config user.email "crate-sync@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No collection changes"
          else
            git commit -m "Sync collection $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
