name: Sync collection and deploy

on:
  schedule:
    - cron: "17 * * * *" # every hour; a run with nothing new takes about a minute
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      # Latest main, not the commit that queued this run, so synced data never starts out stale.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Pull collection from Discogs
        env:
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'Philippemccc' }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python sync/sync_discogs.py

      - name: Find BPM and key
        env:
          ENRICH_MINUTES: "40"
        run: python sync/enrich.py

      - name: Save synced data to the repo
        run: |
          git config user.name "crate-sync"
          git config user.email "crate-sync@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No collection changes"
            git pull --rebase origin main
          else
            git commit -m "Sync collection $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Built after the pull above, so code pushed while this run was busy is included.
      - name: Build site data
        run: python sync/build.py

      - name: Make browsers fetch the new code
        run: sed -i -E "s/(app|camelot)\.js\"/\1.js?v=${GITHUB_SHA::8}\"/g; s/style\.css\"/style.css?v=${GITHUB_SHA::8}\"/g; s/(apple-touch-icon|icon-192|icon-512)\.png\"/\1.png?v=${GITHUB_SHA::8}\"/g" site/index.html
      - name: Include saved edits and mixes
        run: |
          if [ -f user/state.json ]; then mkdir -p site/user && cp user/state.json site/user/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
