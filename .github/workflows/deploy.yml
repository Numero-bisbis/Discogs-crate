name: Deploy site

# The only job that publishes the site, always from the latest main: right after a code push,
# and after each hourly sync has committed new collection data.
on:
  workflow_run:
    workflows: ["Sync collection"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "sync/build.py"
      - "sync/common.py"
      - "sync/tracks.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sync/build.py
      - name: Make browsers fetch the new code
        run: sed -i -E "s/(app|camelot)\.js\"/\1.js?v=$(git rev-parse --short HEAD)\"/g; s/style\.css\"/style.css?v=$(git rev-parse --short HEAD)\"/g; s/manifest\.webmanifest\"/manifest.webmanifest?v=$(git rev-parse --short HEAD)\"/g" site/index.html site/manifest.webmanifest
      - name: Include saved edits and mixes
        run: |
          if [ -f user/state.json ]; then mkdir -p site/user && cp user/state.json site/user/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Check what the live site serves for the home screen icon
        run: |
          sleep 30
          curl -fsS "${{ steps.deploy.outputs.page_url }}" | grep -Eo 'rel="apple-touch-icon" sizes="[^"]*" href="data:image/png;base64,[A-Za-z0-9+/]{20}' || echo "icon link missing"
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
