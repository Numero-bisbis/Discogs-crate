<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f58"/><stop offset="1" stop-color="#171a26"/></linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2e38"/><stop offset="1" stop-color="#15171d"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4e5c"/><stop offset="1" stop-color="#2b2e38"/></linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#08080a"/></radialGradient>
    <clipPath id="top"><rect x="0" y="0" width="512" height="236"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="446" rx="196" ry="20" fill="#000" opacity=".35"/>

  <!-- record sleeves standing in the crate, seen above the rim -->
  <g clip-path="url(#top)">
    <rect x="104" y="128" width="300" height="300" rx="6" fill="#d9d2c3" transform="rotate(-7 254 278)"/>
    <rect x="112" y="116" width="300" height="300" rx="6" fill="#c2462f" transform="rotate(4 262 266)"/>
    <rect x="96" y="132" width="300" height="300" rx="6" fill="#2f6f73" transform="rotate(-2 246 282)"/>
    <rect x="120" y="142" width="300" height="300" rx="6" fill="#e6b34a" transform="rotate(6 270 292)"/>
  </g>

  <!-- the one being pulled out: digging -->
  <g transform="rotate(-8 270 200)">
    <circle cx="300" cy="118" r="78" fill="url(#vinyl)"/>
    <g fill="none" stroke="#2c2c32" stroke-width="2">
      <circle cx="300" cy="118" r="66"/><circle cx="300" cy="118" r="55"/><circle cx="300" cy="118" r="44"/>
    </g>
    <circle cx="300" cy="118" r="25" fill="#7c80ff"/>
    <circle cx="300" cy="118" r="4" fill="#111"/>
    <rect x="160" y="128" width="240" height="240" rx="6" fill="#f2efe8"/>
    <rect x="184" y="152" width="80" height="11" rx="5.5" fill="#16181f" opacity=".85"/>
    <rect x="184" y="172" width="50" height="9" rx="4.5" fill="#16181f" opacity=".35"/>
  </g>

  <!-- milk crate: dark plastic with the classic grid of slots -->
  <rect x="72" y="214" width="368" height="226" rx="20" fill="url(#crate)"/>
  <rect x="72" y="214" width="368" height="34" rx="14" fill="url(#rim)"/>
  <rect x="206" y="223" width="100" height="16" rx="8" fill="#101217"/>
  <g fill="#0c0d11">
    <rect x="92" y="266" width="70" height="40" rx="9"/><rect x="178" y="266" width="70" height="40" rx="9"/><rect x="264" y="266" width="70" height="40" rx="9"/><rect x="350" y="266" width="70" height="40" rx="9"/>
    <rect x="92" y="318" width="70" height="40" rx="9"/><rect x="178" y="318" width="70" height="40" rx="9"/><rect x="264" y="318" width="70" height="40" rx="9"/><rect x="350" y="318" width="70" height="40" rx="9"/>
    <rect x="92" y="370" width="70" height="40" rx="9"/><rect x="178" y="370" width="70" height="40" rx="9"/><rect x="264" y="370" width="70" height="40" rx="9"/><rect x="350" y="370" width="70" height="40" rx="9"/>
  </g>
  <!-- sleeve edges visible through the slots -->
  <g fill="#d9d2c3" opacity=".22">
    <rect x="100" y="272" width="6" height="28" rx="2"/><rect x="190" y="324" width="6" height="28" rx="2"/><rect x="278" y="272" width="6" height="28" rx="2"/><rect x="362" y="376" width="6" height="28" rx="2"/>
  </g>
  <rect x="72" y="214" width="368" height="226" rx="20" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
</svg>
