<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crate</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="disc"></span>Crate</div>
  <nav class="tabs" role="tablist">
    <button data-view="records" class="active">Records</button>
    <button data-view="tracks">Tracks</button>
    <button data-view="generate">Generate</button>
    <button data-view="mixes">My mixes</button>
    <button data-view="settings" aria-label="Settings"><span class="lbl">Settings</span><span class="ico" aria-hidden="true">⚙︎</span></button>
  </nav>
  <input id="search" type="search" placeholder="Search artist, title, label, catno…" autocomplete="off">
</header>
<div id="status" class="status"></div>

<main>
  <section id="view-records" class="view active">
    <div class="filters" id="record-filters"></div>
    <div class="grid" id="record-grid"></div>
  </section>

  <section id="view-tracks" class="view">
    <div class="filters" id="track-filters"></div>
    <div class="table-wrap"><table class="tracks" id="track-table"></table></div>
    <button class="more" id="track-more" hidden>Show more</button>
  </section>

  <section id="view-generate" class="view"><div id="generate"></div></section>

  <section id="view-mixes" class="view">
    <div class="mix-layout">
      <aside class="mix-list">
        <div class="row"><h2>My mixes</h2><button id="new-mix" class="small">+ New</button></div>
        <ul id="mixes"></ul>
      </aside>
      <div class="mix-main" id="mix-main"></div>
    </div>
  </section>

  <section id="view-settings" class="view"><div id="settings"></div></section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-back"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true"><button class="close" aria-label="Close">×</button><div id="drawer-body"></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="camelot.js"></script>
<script src="app.js"></script>
</body>
</html>
