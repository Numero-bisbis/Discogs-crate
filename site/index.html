<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crate</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="icons/icon.svg" alt="" width="30" height="30"><span>Crate</span></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button data-view="records" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5"/></svg><span>Records</span></button>
    <button data-view="tracks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 11h10M4 16h6"/><circle cx="17" cy="17.5" r="2.5"/><path d="M19.5 17.5V6l2 .8"/></svg><span>Tracks</span></button>
    <button data-view="generate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.9 4.6 4.6 1.9-4.6 1.9L11 16l-1.9-4.6L4.5 9.5l4.6-1.9z"/><path d="M18.5 14l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><span>Generate</span></button>
    <button data-view="mixes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5"/><path d="M3.5 16.5l8.5 4.5 8.5-4.5"/></svg><span>Mixes</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>Settings</span></button>
  </nav>
  <div class="search-wrap"><input id="search" type="search" placeholder="Search artist, title, label, cat no." autocomplete="off" enterkeyhint="search"></div>
</header>
<div id="status" class="status"></div>

<main>
  <section id="view-records" class="view active">
    <div class="filters" id="record-filters"></div>
    <div class="grid" id="record-grid"></div>
  </section>

  <section id="view-tracks" class="view">
    <div class="filters" id="track-filters"></div>
    <div class="table-wrap"><table class="tracks" id="track-table"></table></div>
    <button class="more" id="track-more" hidden>Show more</button>
  </section>

  <section id="view-generate" class="view"><div id="generate"></div></section>

  <section id="view-mixes" class="view">
    <div class="mix-layout">
      <aside class="mix-list">
        <div class="row"><h2>My mixes</h2><button id="new-mix" class="small">+ New mix</button></div>
        <ul id="mixes"></ul>
      </aside>
      <div class="mix-main" id="mix-main"></div>
    </div>
  </section>

  <section id="view-settings" class="view"><div id="settings"></div></section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-back"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true"><div class="drawer-bar"><button class="close" aria-label="Back to the list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button><span id="drawer-title"></span></div><div id="drawer-body"></div></div>
</div>
<div id="player" class="player" hidden><div class="pl-head"><div class="pl-info"><b></b><small></small></div><button class="pl-close" aria-label="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="pl-media"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="camelot.js"></script>
<script src="app.js"></script>
</body>
</html>
