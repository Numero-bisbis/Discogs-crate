<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8a33d'/%3E%3Ccircle cx='16' cy='16' r='1.2' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="disc"></span>Crate</div>
  <nav class="tabs" role="tablist">
    <button data-view="records" class="active">Records</button>
    <button data-view="tracks">Tracks</button>
    <button data-view="mixes">Mixes</button>
    <button data-view="settings">Settings</button>
  </nav>
  <input id="search" type="search" placeholder="Search artist, title, label, catno…" autocomplete="off">
</header>
<div id="status" class="status"></div>

<main>
  <section id="view-records" class="view active">
    <div class="filters" id="record-filters"></div>
    <div class="grid" id="record-grid"></div>
  </section>

  <section id="view-tracks" class="view">
    <div class="filters" id="track-filters"></div>
    <div class="table-wrap"><table class="tracks" id="track-table"></table></div>
    <button class="more" id="track-more" hidden>Show more</button>
  </section>

  <section id="view-mixes" class="view">
    <div class="mix-layout">
      <aside class="mix-list">
        <div class="row"><h2>Mixes</h2><button id="new-mix" class="small">+ New</button></div>
        <ul id="mixes"></ul>
      </aside>
      <div class="mix-main" id="mix-main"></div>
    </div>
  </section>

  <section id="view-settings" class="view"><div id="settings"></div></section>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-back"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true"><button class="close" aria-label="Close">×</button><div id="drawer-body"></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="camelot.js"></script>
<script src="app.js"></script>
</body>
</html>
